<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel Planner</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="overlay"></div>
  <main class="planner-container">
    <header class="planner-header">
      <h1>Travel Planner</h1>
      <p>Build your trip timeline and keep all stops in one place.</p>
    </header>

    <section class="planner-form-card">
      <h2>Add a Stop</h2>
      <form id="tripForm">
        <div class="form-group">
          <label for="destination">Destination</label>
          <input id="destination" name="destination" type="text" placeholder="e.g., Barcelona" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="startDate">Start Date</label>
            <input id="startDate" name="startDate" type="date" required>
          </div>
          <div class="form-group">
            <label for="endDate">End Date</label>
            <input id="endDate" name="endDate" type="date" required>
          </div>
        </div>

        <div class="form-group">
          <label for="activity">Top Activity</label>
          <input id="activity" name="activity" type="text" placeholder="e.g., City bike tour" required>
        </div>

        <button type="submit">Add to Itinerary</button>
      </form>
    </section>

    <section class="itinerary-card">
      <div class="itinerary-title-row">
        <h2>Your Itinerary</h2>
        <span id="stopCount">0 stops</span>
      </div>
      <ul id="tripList" class="trip-list"></ul>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
